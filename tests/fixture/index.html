<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SymbUI 本地测试页</title>
    <link rel="stylesheet" href="./fixture.css" />
    <style>
      :root {
        color: #e5eefc;
        background: #07111f;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 20% 10%, #153351, transparent 34rem),
          #07111f;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 7vw;
        border-bottom: 1px solid #28405d;
      }
      header strong {
        color: #67e8f9;
        font-size: 20px;
      }
      main {
        width: min(1080px, 86vw);
        margin: 64px auto;
      }
      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(42px, 7vw, 82px);
        line-height: 0.98;
      }
      .lead {
        max-width: 650px;
        margin: 24px 0 34px;
        color: #9db0c8;
        font-size: 18px;
        line-height: 1.7;
      }
      button,
      input {
        border: 0;
        border-radius: 10px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .primary {
        padding: 12px 18px;
        color: #062132;
        background: #67e8f9;
        font-weight: 800;
      }
      .secondary {
        padding: 12px 18px;
        color: #dbeafe;
        background: #20334d;
      }
      .actions {
        display: flex;
        gap: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 64px;
      }
      .card {
        min-height: 190px;
        padding: 22px;
        border: 1px solid #28405d;
        border-radius: 16px;
        background: rgba(14, 29, 49, 0.88);
      }
      .card span {
        color: #67e8f9;
        font-size: 12px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .card h2 {
        margin: 14px 0 8px;
      }
      .card p {
        color: #91a5bd;
        line-height: 1.55;
      }
      .menu {
        position: absolute;
        top: 72px;
        right: 7vw;
        display: none;
        width: 220px;
        padding: 10px;
        border: 1px solid #345170;
        border-radius: 12px;
        background: #102139;
        box-shadow: 0 22px 60px #0008;
      }
      .menu.open {
        display: grid;
        gap: 6px;
      }
      .menu button {
        padding: 10px;
        color: #dbeafe;
        text-align: left;
        background: transparent;
      }
      .dialog-backdrop {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: #020617b8;
      }
      .dialog-backdrop.open {
        display: grid;
      }
      .dialog {
        width: min(420px, 88vw);
        padding: 26px;
        border: 1px solid #345170;
        border-radius: 18px;
        background: #102139;
      }
      .dialog input {
        width: 100%;
        margin: 8px 0 18px;
        padding: 11px 12px;
        color: #e5eefc;
        background: #07111f;
      }
      .counter {
        margin-left: 8px;
        color: #fbbf24;
      }
      @media (max-width: 720px) {
        header {
          padding-inline: 5vw;
        }
        main {
          width: 90vw;
          margin-top: 42px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>LOCAL/LAB</strong>
      <button id="menu-button" class="secondary" aria-expanded="false">
        打开菜单
      </button>
      <div id="menu" class="menu" role="menu">
        <button role="menuitem">账户设置</button>
        <button role="menuitem">界面偏好</button>
      </div>
    </header>

    <main>
      <h1>让视觉修改指令变得可验证。</h1>
      <p class="lead">
        这是 SymbUI 的本地功能测试页。按钮、菜单和弹窗用于验证注入浮窗不会破坏原有交互。
      </p>
      <div class="actions">
        <button
          id="upgrade-plan"
          class="primary"
          data-testid="upgrade-plan"
          data-component="UpgradeButton"
          data-ui-source="tests/fixture/index.html:186"
        >
          升级方案
        </button>
        <button id="count-button" class="secondary">
          点击计数 <span id="count" class="counter">0</span>
        </button>
      </div>

      <section class="grid" aria-label="功能卡片">
        <article class="card">
          <span>01 / Live</span>
          <h2>真实页面交互</h2>
          <p>在标注前仍可正常操作按钮、菜单、表单和页面路由。</p>
        </article>
        <article class="card">
          <span>02 / Freeze</span>
          <h2>稳定冻结画面</h2>
          <p>使用浏览器原生截图保存弹窗、菜单和临时状态。</p>
        </article>
        <article class="card">
          <span>03 / Spec</span>
          <h2>结构化意图</h2>
          <p>将目标、预期结果、范围和保持不变项绑定到同一标注。</p>
        </article>
      </section>
    </main>

    <div id="dialog-backdrop" class="dialog-backdrop" role="presentation">
      <section
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
      >
        <h2 id="dialog-title">升级本地方案</h2>
        <label for="secret">测试密码值不会被采集</label>
        <input id="secret" type="password" value="not-for-export" />
        <div class="actions">
          <button id="confirm-upgrade" class="primary">确认</button>
          <button id="close-dialog" class="secondary">关闭</button>
        </div>
      </section>
    </div>

    <script>
      const menuButton = document.querySelector("#menu-button");
      const menu = document.querySelector("#menu");
      const dialog = document.querySelector("#dialog-backdrop");
      const count = document.querySelector("#count");

      menuButton.addEventListener("click", () => {
        const open = menu.classList.toggle("open");
        menuButton.setAttribute("aria-expanded", String(open));
      });
      document.querySelector("#upgrade-plan").addEventListener("click", () => {
        dialog.classList.add("open");
      });
      document.querySelector("#close-dialog").addEventListener("click", () => {
        dialog.classList.remove("open");
      });
      document.querySelector("#confirm-upgrade").addEventListener("click", () => {
        dialog.classList.remove("open");
      });
      document.querySelector("#count-button").addEventListener("click", () => {
        count.textContent = String(Number(count.textContent) + 1);
      });
    </script>
    <script src="./fixture.js"></script>
  </body>
</html>
